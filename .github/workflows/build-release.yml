name: Build & Publish Cross-Platform Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    name: Build Windows Desktop (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript & Production Vite Build
        run: npm run build

      - name: Build Windows NSIS Installer & Portable .exe
        run: npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload Windows .exe Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-release
          path: |
            release/AnatomyAtlas3D-Windows-x64.exe
            release/AnatomyAtlas3D-Windows-x64-Setup.exe
          if-no-files-found: error

  build-android-apk:
    name: Build Android Mobile (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Runner Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk || true
          df -h

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript & Production Vite Build
        run: npm run build

      - name: Sync Capacitor Android Project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          node scripts/configureAndroidGradle.mjs

      - name: Build Android Debug & Unsigned Release APKs
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Stage APK Artifacts
        run: |
          mkdir -p artifacts-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts-apk/AnatomyAtlas3D-Android.apk
          if [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk artifacts-apk/AnatomyAtlas3D-Android-unsigned.apk
          fi
          ls -lh artifacts-apk

      - name: Upload Android APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-mobile-apk
          path: artifacts-apk/*.apk
          if-no-files-found: error

  publish-github-release:
    name: Publish GitHub Release
    needs: [build-windows-exe, build-android-apk]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-desktop-release
          path: dist-release

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-mobile-apk
          path: dist-release

      - name: List Staged Release Assets
        run: ls -lh dist-release

      - name: Publish Release Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist-release/AnatomyAtlas3D-Windows-x64.exe
            dist-release/AnatomyAtlas3D-Windows-x64-Setup.exe
            dist-release/AnatomyAtlas3D-Android.apk
            dist-release/AnatomyAtlas3D-Android-unsigned.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
