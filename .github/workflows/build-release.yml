name: Build & Publish Cross-Platform Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    name: Build Windows 1-Click Installer (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies & Reassemble Split Assets
        run: npm ci

      - name: Run TypeScript & Production Vite Build
        run: npm run build

      - name: Verify Reassembled PDF Textbooks in dist/books
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/books/book1-netters-atlas-7ed.pdf")) { throw "Missing reassembled book1 PDF in dist/books" }
          if (-not (Test-Path "dist/books/book2-grays-anatomy-4ed.pdf")) { throw "Missing reassembled book2 PDF in dist/books" }
          $strayParts = Get-ChildItem -Path dist -Recurse -File | Where-Object { $_.Name -match '\.part\d+$|\.chunks\.json$' }
          if ($strayParts) { throw "Found unexpected split chunks inside dist/" }
          Get-ChildItem dist/books | Select-Object Name, Length

      - name: Build Windows One-Click Silent Installer (AnatomyAtlas3D-Setup.exe)
        run: npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload Windows .exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-release
          path: release/AnatomyAtlas3D-Setup.exe
          if-no-files-found: error

  build-android-apk:
    name: Build Android Mobile (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Runner Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk || true
          df -h

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK (compileSdk 36)
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          sudo chown -R "$(whoami)" "$SDK_ROOT" || true
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -z "$SDKMANAGER" ]; then
            mkdir -p "$SDK_ROOT/cmdline-tools/latest"
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-unpack
            cp -r /tmp/cmdline-unpack/cmdline-tools/* "$SDK_ROOT/cmdline-tools/latest/"
            rm -rf /tmp/cmdline-tools.zip /tmp/cmdline-unpack
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Install Dependencies & Reassemble Split Assets
        run: npm ci

      - name: Run TypeScript & Production Vite Build
        run: npm run build

      - name: Sync Capacitor Android Project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          node scripts/configureAndroidGradle.mjs

      - name: Build Installable Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Stage Fixed Android APK Artifact
        run: |
          mkdir -p artifacts-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts-apk/AnatomyAtlas3D-Android.apk
          ls -lh artifacts-apk/AnatomyAtlas3D-Android.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-mobile-apk
          path: artifacts-apk/AnatomyAtlas3D-Android.apk
          if-no-files-found: error

  publish-github-release:
    name: Publish GitHub Release
    needs: [build-windows-exe, build-android-apk]
    if: always() && !cancelled() && startsWith(github.ref, 'refs/tags/v') && (needs.build-windows-exe.result == 'success' || needs.build-android-apk.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Installer Artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: windows-desktop-release
          path: dist-release

      - name: Download Android APK Artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: android-mobile-apk
          path: dist-release

      - name: List Staged Release Assets
        run: ls -lh dist-release

      - name: Publish Release Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist-release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
